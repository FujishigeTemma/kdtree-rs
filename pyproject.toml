[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "kdtree-rs"
version = "0.3.1"
description = "A minimal, high-performance KDTree for free-threaded CPython"
authors = [{ name = "FUJISHIGE TEMMA", email = "tenma.x0@gmail.com" }]
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.13"
dependencies = ["numpy>=2.4"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/FujishigeTemma/kdtree-rs"
Issues = "https://github.com/FujishigeTemma/kdtree-rs/issues"

[dependency-groups]
dev = [
    "hypothesis==6.155.7", # newer releases require PyO3 unsupported by CPython 3.13t
    "maturin>=1.13,<2.0",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.11",
    "scipy>=1.17.1",
    "ty>=0.0.71",
]

[tool.maturin]
module-name = "kdtree._core"
python-source = "python"
python-packages = ["kdtree"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
addopts = "--benchmark-warmup=on --benchmark-warmup-iterations=8"
testpaths = ["tests"]
