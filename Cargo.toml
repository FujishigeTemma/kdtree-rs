[package]
name = "kdtree"
version = "0.3.1"
edition = "2024"
description = "A minimal, high-performance KDTree for free-threaded CPython"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FujishigeTemma/kdtree-rs"

[lib]
name = "kdtree"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.17.1"
numpy = "0.28.0"
pyo3 = "0.28.3"
rayon = "1.11.0"

[dev-dependencies]
allocation-counter = "0.8.1"
approx = "0.5.1"
